<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Localnotes | My Personal Notepad</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .editor-textarea:focus { outline: none; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
        .markdown-preview h1 { font-size: 2rem; font-weight: 700; margin-bottom: 1rem; }
        .markdown-preview h2 { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.75rem; }
        .markdown-preview p { margin-bottom: 1rem; color: #d4d4d8; }
        .markdown-preview ul { list-style-type: disc; margin-left: 1.5rem; margin-bottom: 1rem; }
        .markdown-preview code { background: #27272a; padding: 2px 4px; border-radius: 4px; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 h-screen overflow-hidden">

<div class="flex h-full">
    <!-- Sidebar -->
    <aside class="w-72 border-r border-zinc-800 flex flex-col bg-zinc-900/50">
        <div class="p-6">
            <div class="flex items-center gap-2 mb-8">
                <i data-lucide="notebook-pen" class="text-indigo-500"></i>
                <h1 class="text-xl font-bold tracking-tight">Localnotes</h1>
            </div>
            
            <button id="new-note" class="w-full flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-500 py-2.5 rounded-lg transition-all font-medium mb-6">
                <i data-lucide="plus" size="18"></i> New Note
            </button>

            <div class="relative mb-4">
                <i data-lucide="search" class="absolute left-3 top-3 text-zinc-500" size="18"></i>
                <input id="search" type="text" placeholder="Search notes..." class="w-full bg-zinc-800 border-none rounded-lg pl-10 py-2.5 text-sm focus:ring-1 focus:ring-indigo-500 transition-all">
            </div>
        </div>

        <nav id="notes-list" class="flex-1 overflow-y-auto px-4 pb-6 space-y-1">
            <!-- Notes injected here -->
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col min-w-0">
        <header class="h-16 border-b border-zinc-800 flex items-center justify-between px-8 bg-zinc-950">
            <div class="flex items-center gap-6">
                <input id="note-title" type="text" placeholder="Note Title (e.g. hello.md)" class="bg-transparent border-none text-lg font-semibold focus:outline-none w-64">
                <div class="flex items-center gap-1 p-1 bg-zinc-900 rounded-lg">
                    <button id="tab-edit" class="px-4 py-1.5 rounded-md text-sm font-medium transition-all bg-zinc-800 text-white">Editor</button>
                    <button id="tab-preview" class="px-4 py-1.5 rounded-md text-sm font-medium transition-all text-zinc-400 hover:text-white">Preview</button>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <span id="save-status" class="text-xs text-zinc-500"></span>
                <button id="delete-note" class="p-2 text-zinc-500 hover:text-red-400 transition-colors">
                    <i data-lucide="trash-2" size="20"></i>
                </button>
            </div>
        </header>

        <div class="flex-1 relative overflow-hidden flex">
            <!-- Editor -->
            <textarea id="editor" class="editor-textarea flex-1 p-12 bg-transparent resize-none text-zinc-300 leading-relaxed text-lg" placeholder="Start writing..."></textarea>
            
            <!-- Preview -->
            <div id="preview" class="hidden flex-1 p-12 overflow-y-auto markdown-preview bg-zinc-900/30"></div>
        </div>
    </main>
</div>

<script>
    lucide.createIcons();

    let currentNote = null;
    let timeout = null;

    const notesList = document.getElementById('notes-list');
    const noteTitle = document.getElementById('note-title');
    const editor = document.getElementById('editor');
    const preview = document.getElementById('preview');
    const saveStatus = document.getElementById('save-status');
    const searchInput = document.getElementById('search');

    async function fetchNotes() {
        const res = await fetch('/api/notes');
        const notes = await res.json();
        renderNotes(notes);
    }

    function renderNotes(notes) {
        const filter = searchInput.value.toLowerCase();
        notesList.innerHTML = '';
        notes.filter(n => n.toLowerCase().includes(filter)).forEach(filename => {
            const div = document.createElement('div');
            div.className = `group flex items-center justify-between p-3 rounded-lg cursor-pointer transition-all ${currentNote === filename ? 'bg-zinc-800 text-white' : 'text-zinc-400 hover:bg-zinc-800/50 hover:text-zinc-200'}`;
            div.innerHTML = `
                <div class="flex items-center gap-3 overflow-hidden">
                    <i data-lucide="file-text" size="16"></i>
                    <span class="truncate text-sm font-medium">${filename}</span>
                </div>
            `;
            div.onclick = () => loadNote(filename);
            notesList.appendChild(div);
        });
        lucide.createIcons();
    }

    async function loadNote(filename) {
        currentNote = filename;
        const res = await fetch(`/api/notes/${filename}`);
        const data = await res.json();
        noteTitle.value = data.filename;
        editor.value = data.content;
        updatePreview();
        fetchNotes();
        saveStatus.innerText = 'All changes saved';
    }

    function updatePreview() {
        preview.innerHTML = marked.parse(editor.value);
    }

    async function saveNote() {
        if (!noteTitle.value) return;
        saveStatus.innerText = 'Saving...';
        const res = await fetch('/api/notes', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                filename: noteTitle.value,
                content: editor.value
            })
        });
        const data = await res.json();
        currentNote = data.filename;
        saveStatus.innerText = 'Saved';
        fetchNotes();
    }

    // New Note
    document.getElementById('new-note').onclick = () => {
        currentNote = null;
        noteTitle.value = '';
        editor.value = '';
        preview.innerHTML = '';
        saveStatus.innerText = '';
        noteTitle.focus();
    };

    // Auto-save
    editor.oninput = () => {
        updatePreview();
        clearTimeout(timeout);
        timeout = setTimeout(saveNote, 1000);
    };

    noteTitle.oninput = () => {
        clearTimeout(timeout);
        timeout = setTimeout(saveNote, 1000);
    };

    // Search
    searchInput.oninput = () => fetchNotes();

    // Tabs
    const tabEdit = document.getElementById('tab-edit');
    const tabPreview = document.getElementById('tab-preview');

    tabEdit.onclick = () => {
        tabEdit.classList.add('bg-zinc-800', 'text-white');
        tabEdit.classList.remove('text-zinc-400');
        tabPreview.classList.remove('bg-zinc-800', 'text-white');
        tabPreview.classList.add('text-zinc-400');
        editor.classList.remove('hidden');
        preview.classList.add('hidden');
    };

    tabPreview.onclick = () => {
        tabPreview.classList.add('bg-zinc-800', 'text-white');
        tabPreview.classList.remove('text-zinc-400');
        tabEdit.classList.remove('bg-zinc-800', 'text-white');
        tabEdit.classList.add('text-zinc-400');
        editor.classList.add('hidden');
        preview.classList.remove('hidden');
        updatePreview();
    };

    // Delete
    document.getElementById('delete-note').onclick = async () => {
        if (!currentNote) return;
        if (confirm(`Are you sure you want to delete ${currentNote}?`)) {
            await fetch(`/api/notes/${currentNote}`, { method: 'DELETE' });
            currentNote = null;
            noteTitle.value = '';
            editor.value = '';
            fetchNotes();
        }
    };

    fetchNotes();
</script>

</body>
</html>
